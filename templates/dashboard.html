<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AeroVision – Live Dashboard</title>
<style>
  :root {
    --bg:       #0a0e1a;
    --surface:  #111827;
    --card:     #1a2236;
    --border:   #1e2d45;
    --accent:   #0ea5e9;
    --accent2:  #06b6d4;
    --low:      #22c55e;
    --med:      #f59e0b;
    --high:     #ef4444;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --font:     'Segoe UI', system-ui, sans-serif;
    --mono:     'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ── HEADER ─────────────────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 20px;
  }
  .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: .05em; color: var(--accent); }
  .logo span { color: var(--text); }
  .status-pill {
    font-size: .72rem; font-weight: 700; letter-spacing: .1em;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(34,197,94,.15); color: var(--low); border: 1px solid var(--low);
  }
  .status-pill.danger { background: rgba(239,68,68,.15); color: var(--high); border-color: var(--high); }
  #hdr-timestamp { margin-left: auto; font-size: .78rem; color: var(--muted); font-family: var(--mono); }
  #hdr-source { font-size: .72rem; color: var(--accent2); margin-left: 8px; }

  /* ── MAIN GRID ───────────────────────────────────────────────────── */
  main { flex: 1; padding: 18px 24px; display: flex; flex-direction: column; gap: 16px; }

  /* ── SYSTEM METRICS ROW ─────────────────────────────────────────── */
  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .metric-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .metric-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
  .metric-value { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .metric-sub { font-size: .72rem; color: var(--muted); margin-top: 3px; }
  .metric-sub.up { color: var(--low); }
  .metric-sub.down { color: var(--high); }

  /* ── COUNTERS SECTION ───────────────────────────────────────────── */
  .section-title {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin-bottom: 8px;
  }
  .counters-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .counter-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    transition: border-color .3s;
  }
  .counter-card.risk-high  { border-color: var(--high); }
  .counter-card.risk-medium{ border-color: var(--med);  }
  .counter-card.risk-low   { border-color: var(--low);  }
  .counter-name { font-weight: 600; font-size: .88rem; margin-bottom: 4px; }
  .counter-type { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .risk-badge {
    display: inline-block; font-size: .65rem; font-weight: 700;
    letter-spacing: .1em; padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .risk-badge.High   { background: rgba(239,68,68,.2);  color: var(--high); }
  .risk-badge.Medium { background: rgba(245,158,11,.2); color: var(--med);  }
  .risk-badge.Low    { background: rgba(34,197,94,.2);  color: var(--low);  }
  .queue-bar-wrap { background: var(--bg); border-radius: 4px; height: 6px; margin-bottom: 10px; overflow: hidden; }
  .queue-bar { height: 100%; border-radius: 4px; transition: width .6s ease, background .4s; }
  .counter-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  .stat-item { font-size: .72rem; }
  .stat-label { color: var(--muted); }
  .stat-value { font-family: var(--mono); font-weight: 600; }
  .forecast-row { margin-top: 8px; font-size: .72rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
  .forecast-row span { color: var(--text); font-family: var(--mono); }

  /* ── BOTTOM SPLIT: FLIGHTS + SCENE ─────────────────────────────── */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }

  /* flights */
  .flight-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: .82rem;
  }
  .flight-row:last-child { border-bottom: none; }
  .flight-id { font-family: var(--mono); font-weight: 700; color: var(--accent); min-width: 58px; }
  .flight-status { font-size: .68rem; color: var(--muted); }
  .at-risk-badge {
    margin-left: auto; font-size: .65rem; font-weight: 700; padding: 2px 8px;
    border-radius: 4px; letter-spacing: .08em; text-transform: uppercase;
  }
  .at-risk-badge.yes { background: rgba(239,68,68,.2); color: var(--high); }
  .at-risk-badge.no  { background: rgba(34,197,94,.2);  color: var(--low);  }
  .flight-expect { font-size: .68rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }

  /* scene */
  .scene-risk {
    font-size: .78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; padding: 3px 10px; border-radius: 6px;
    display: inline-block; margin-bottom: 10px;
  }
  .scene-risk.high   { background: rgba(239,68,68,.15); color: var(--high);  border: 1px solid var(--high); }
  .scene-risk.medium { background: rgba(245,158,11,.15);color: var(--med);   border: 1px solid var(--med);  }
  .scene-risk.low    { background: rgba(34,197,94,.15); color: var(--low);   border: 1px solid var(--low);  }
  .factor-list { list-style: none; font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .factor-list li::before { content: '↳ '; color: var(--accent2); }

  /* ── OPTIMIZATIONS ──────────────────────────────────────────────── */
  .opt-list { display: flex; flex-direction: column; gap: 8px; }
  .opt-card {
    background: var(--surface); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 10px 14px;
    font-size: .8rem; display: flex; align-items: flex-start; gap: 10px;
  }
  .opt-card.priority-high   { border-left-color: var(--high); }
  .opt-card.priority-medium { border-left-color: var(--med);  }
  .opt-card.priority-low    { border-left-color: var(--low);  }
  .opt-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
  .opt-action { font-weight: 600; }
  .opt-reason { color: var(--muted); font-size: .73rem; margin-top: 2px; }
  .opt-meta   { font-size: .68rem; color: var(--accent2); margin-top: 3px; }
  .no-opt { color: var(--muted); font-size: .8rem; padding: 8px 0; }

  /* ── TIMELINE ───────────────────────────────────────────────────── */
  .timeline-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 24px; display: flex; align-items: center; gap: 14px;
  }
  .tl-label { font-size: .7rem; color: var(--muted); white-space: nowrap; }
  .tl-frames { display: flex; gap: 6px; align-items: center; }
  .tl-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); cursor: pointer;
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: .6rem; color: var(--muted); font-family: var(--mono);
    transition: all .2s;
  }
  .tl-dot:hover { background: var(--card); border-color: var(--accent2); color: var(--text); }
  .tl-dot.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .tl-dot.visited { background: var(--card); border-color: var(--accent2); color: var(--accent2); }
  .tl-btn {
    padding: 4px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: .78rem;
    transition: background .15s;
  }
  .tl-btn:hover { background: var(--border); }
  .tl-btn.active-play { background: rgba(14,165,233,.2); border-color: var(--accent); color: var(--accent); }
  #tl-counter { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--low);
    animation: pulse 2s infinite;
  }
  .conn-dot.disconnected { background: var(--high); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: .3; }
  }

  /* ── FADE TRANSITION ────────────────────────────────────────────── */
  .fade-update { animation: fadeUp .35s ease; }
  @keyframes fadeUp {
    from { opacity: .4; transform: translateY(4px); }
    to   { opacity: 1;  transform: translateY(0);   }
  }
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">🛫 Aero<span>Vision</span></div>
  <div id="hdr-status" class="status-pill">CONNECTING…</div>
  <div id="hdr-source">snapshot4 · live</div>
  <div id="hdr-timestamp">—</div>
</header>

<!-- ── MAIN ───────────────────────────────────────────────────────────── -->
<main>

  <!-- System metrics -->
  <div>
    <div class="section-title">System Metrics</div>
    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-label">Throughput</div>
        <div class="metric-value" id="m-throughput">—</div>
        <div class="metric-sub" id="m-throughput-chg">pax / hr</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Avg Clearance</div>
        <div class="metric-value" id="m-clearance">—</div>
        <div class="metric-sub" id="m-clearance-delta">vs baseline</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Critical Bottlenecks</div>
        <div class="metric-value" id="m-bottlenecks">—</div>
        <div class="metric-sub">high-risk counters</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Flights at Risk</div>
        <div class="metric-value" id="m-flights-risk">—</div>
        <div class="metric-sub">boarding impact possible</div>
      </div>
    </div>
  </div>

  <!-- Counters -->
  <div>
    <div class="section-title">Check-in Counters</div>
    <div class="counters-grid" id="counters-grid">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- Bottom row: flights + scene analysis -->
  <div class="bottom-row">
    <div class="panel">
      <div class="section-title">Flights</div>
      <div id="flights-list"></div>
    </div>
    <div class="panel">
      <div class="section-title">Scene Analysis</div>
      <div id="scene-panel"></div>
    </div>
  </div>

  <!-- Optimizations -->
  <div class="panel">
    <div class="section-title">Warnings &amp; Suggestions</div>
    <div class="opt-list" id="opt-list"></div>
  </div>

</main>

<!-- ── TIMELINE ───────────────────────────────────────────────────────── -->
<div class="timeline-bar">
  <div class="conn-dot" id="conn-dot"></div>
  <div class="tl-label">Frames</div>
  <div class="tl-frames" id="tl-frames"></div>
  <button class="tl-btn" id="btn-prev">◀</button>
  <button class="tl-btn active-play" id="btn-play">⏸ Pause</button>
  <button class="tl-btn" id="btn-next">▶</button>
  <div id="tl-counter" style="margin-left:auto">Frame — / —</div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────
let totalFrames = 0;
let currentFrame = 0;
let playing = true;
let playTimer = null;
let evtSource = null;
let sceneData = null;

// ── Fetch scene analysis once ────────────────────────────────────────────
fetch('/api/mock/scene')
  .then(r => r.json())
  .then(d => { sceneData = d; renderScene(d); });

// ── SSE connection ───────────────────────────────────────────────────────
function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/stream');

  evtSource.onopen = () => {
    document.getElementById('conn-dot').className = 'conn-dot';
    document.getElementById('hdr-status').textContent = 'LIVE';
    document.getElementById('hdr-status').className = 'status-pill';
  };

  evtSource.onmessage = e => {
    if (!playing) return;        // ignore server pushes when user is scrubbing
    const data = JSON.parse(e.data);
    applyData(data);
  };

  evtSource.onerror = () => {
    document.getElementById('conn-dot').className = 'conn-dot disconnected';
    document.getElementById('hdr-status').textContent = 'RECONNECTING…';
    document.getElementById('hdr-status').className = 'status-pill danger';
    evtSource.close();
    setTimeout(connectSSE, 3000);
  };
}

// ── Manual frame fetch ───────────────────────────────────────────────────
function fetchFrame(idx) {
  fetch(`/api/mock/snapshot/${idx}`)
    .then(r => r.json())
    .then(d => { d._frame = idx; applyData(d); });
}

// ── Render full dashboard from data ─────────────────────────────────────
function applyData(data) {
  // Track frame position
  if (data._frame !== undefined) {
    currentFrame = data._frame;
    totalFrames  = data._total || totalFrames;
    buildTimeline();
  }

  updateMetrics(data.system_metrics || {});
  renderCounters(data.counters || []);
  renderFlights(data.flights || []);
  renderOpts(data.optimizations || []);
}

// ── Utility ──────────────────────────────────────────────────────────────
function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

// ── System metrics ───────────────────────────────────────────────────────
function updateMetrics(m) {
  setText('m-throughput', m.throughput ?? '—');
  const chg = m.throughput_change_pct;
  const chgEl = document.getElementById('m-throughput-chg');
  chgEl.textContent = chg != null ? `${chg > 0 ? '+' : ''}${chg.toFixed(1)}% vs baseline` : 'pax / hr';
  chgEl.className = 'metric-sub ' + (chg > 0 ? 'up' : chg < 0 ? 'down' : '');

  setText('m-clearance', m.avg_clearance_time ?? '—');
  const delta = m.avg_clearance_delta ?? '';
  const dEl = document.getElementById('m-clearance-delta');
  dEl.textContent = delta ? `${delta} vs baseline` : 'vs baseline';
  dEl.className = 'metric-sub ' + (delta.startsWith('+') ? 'down' : delta.startsWith('-') ? 'up' : '');

  setText('m-bottlenecks', m.critical_bottlenecks ?? '—');
  setText('m-flights-risk', m.flights_at_risk ?? '—');

  // Header
  document.getElementById('hdr-timestamp').textContent = m.timestamp || '';
  const pill = document.getElementById('hdr-status');
  pill.textContent = m.action_required ? '⚠ ACTION REQUIRED' : 'SYSTEM ACTIVE';
  pill.className   = 'status-pill' + (m.action_required ? ' danger' : '');
}

// ── Counter cards ────────────────────────────────────────────────────────
function riskColor(r) {
  return r === 'High' ? 'var(--high)' : r === 'Medium' ? 'var(--med)' : 'var(--low)';
}

function renderCounters(counters) {
  const grid = document.getElementById('counters-grid');
  // Keep existing cards and update in-place to avoid flicker
  if (grid.children.length !== counters.length) {
    grid.innerHTML = '';
    counters.forEach((_, i) => {
      const el = document.createElement('div');
      el.className = 'counter-card';
      el.id = `counter-${i}`;
      grid.appendChild(el);
    });
  }
  counters.forEach((c, i) => {
    const el = document.getElementById(`counter-${i}`);
    el.className = `counter-card risk-${c.risk_level}`;
    const qmax = 25; // visual max for bar
    const qpct = Math.min(100, ((c.queue_size || 0) / qmax) * 100);
    const barColor = riskColor(c.risk_level);

    el.innerHTML = `
      <div class="counter-name">${c.id}</div>
      <div class="counter-type">${c.type}</div>
      <span class="risk-badge ${c.risk_level}">${c.risk_level || '—'}</span>
      <div class="queue-bar-wrap">
        <div class="queue-bar" style="width:${qpct}%;background:${barColor}"></div>
      </div>
      <div class="counter-stats">
        <div class="stat-item"><div class="stat-label">Queue</div><div class="stat-value">${c.queue_size ?? '—'} pax</div></div>
        <div class="stat-item"><div class="stat-label">Flow</div><div class="stat-value">${(c.flow_rate||0).toFixed(1)}/min</div></div>
        <div class="stat-item"><div class="stat-label">Throughput</div><div class="stat-value">${c.throughput ?? '—'}/hr</div></div>
        <div class="stat-item"><div class="stat-label">Baggage</div><div class="stat-value">${(c.avg_baggage||0).toFixed(1)} avg</div></div>
        ${c.special_items > 0 ? `<div class="stat-item" style="grid-column:span 2"><div class="stat-label">Special items</div><div class="stat-value" style="color:var(--med)">${c.special_items} ⚠</div></div>` : ''}
      </div>
      <div class="forecast-row">Forecast: <span>${c.forecast || '—'}</span></div>
    `;
    el.classList.add('fade-update');
    setTimeout(() => el.classList.remove('fade-update'), 400);
  });
}

// ── Flights ──────────────────────────────────────────────────────────────
function renderFlights(flights) {
  const el = document.getElementById('flights-list');
  if (!flights.length) { el.innerHTML = '<div class="no-opt">No flights registered.</div>'; return; }
  el.innerHTML = flights.map(f => `
    <div class="flight-row">
      <div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="flight-id">${f.id}</span>
          <span class="flight-status">${f.status || ''}</span>
          <span class="at-risk-badge ${f.at_risk ? 'yes' : 'no'}">${f.at_risk ? '⚠ AT RISK' : '✓ OK'}</span>
        </div>
        <div class="flight-expect">${f.expectation || ''}</div>
        ${f.clearance_forecast ? `<div class="flight-expect" style="color:var(--accent2)">Clearance: ${f.clearance_forecast}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ── Scene analysis ───────────────────────────────────────────────────────
function renderScene(scene) {
  if (!scene) return;
  const panel = document.getElementById('scene-panel');
  const risk = scene.gateway_congestion_prediction || {};
  const factors = scene.contributing_factors || [];
  const flow = scene.passenger_flow || {};
  const solutions = scene.recommended_solutions || [];

  panel.innerHTML = `
    <span class="scene-risk ${risk.risk_level || 'low'}">
      ${(risk.risk_level || '—').toUpperCase()} RISK
      ${risk.confidence ? `· ${risk.confidence} confidence` : ''}
    </span>
    <div style="font-size:.75rem;color:var(--muted);margin-bottom:8px">${risk.explanation || ''}</div>
    ${flow.crowd_density ? `<div style="font-size:.72rem;margin-bottom:6px">Density: <strong>${flow.crowd_density}</strong> · Movement: <strong>${flow.movement_intensity || '—'}</strong></div>` : ''}
    ${factors.length ? `
      <div class="section-title" style="margin-bottom:4px">Contributing factors</div>
      <ul class="factor-list">
        ${factors.map(f => `<li>${f.factor}</li>`).join('')}
      </ul>` : ''}
    ${solutions.length ? `
      <div class="section-title" style="margin-top:10px;margin-bottom:4px">Recommended actions</div>
      <ul class="factor-list">
        ${solutions.map(s => `<li>${s.solution}</li>`).join('')}
      </ul>` : ''}
  `;
}

// ── Optimizations ────────────────────────────────────────────────────────
const optIcons = {
  'Reallocate Staff':         '👥',
  'Open Special Items Lane':  '🧳',
  'Deploy Additional Agent':  '🚨',
  'Open Relief Counter':      '🔓',
};
function impactClass(pct) {
  if (pct >= 40) return 'priority-high';
  if (pct >= 20) return 'priority-medium';
  return 'priority-low';
}
function renderOpts(opts) {
  const el = document.getElementById('opt-list');
  if (!opts.length) {
    el.innerHTML = '<div class="no-opt">✓ No warnings or suggestions at this time.</div>';
    return;
  }
  el.innerHTML = opts.map(o => `
    <div class="opt-card ${impactClass(o.estimated_impact || 0)}">
      <span class="opt-icon">${optIcons[o.action] || '⚠'}</span>
      <div>
        <div class="opt-action">${o.action}</div>
        <div class="opt-reason">${o.details || ''}</div>
        <div class="opt-meta">${o.estimated_impact != null ? `~${o.estimated_impact}% delay reduction` : ''}</div>
      </div>
    </div>
  `).join('');
}

// ── Timeline ─────────────────────────────────────────────────────────────
function buildTimeline() {
  const wrap = document.getElementById('tl-frames');
  // Build dots only once or when total changes
  if (wrap.children.length !== totalFrames) {
    wrap.innerHTML = '';
    for (let i = 0; i < totalFrames; i++) {
      const dot = document.createElement('div');
      dot.className = 'tl-dot';
      dot.textContent = i;
      dot.title = `Frame ${i}`;
      dot.addEventListener('click', () => {
        stopPlay();
        fetchFrame(i);
      });
      wrap.appendChild(dot);
    }
  }
  // Mark visited + active
  [...wrap.children].forEach((dot, i) => {
    dot.className = 'tl-dot' + (i === currentFrame ? ' active' : i < currentFrame ? ' visited' : '');
  });
  document.getElementById('tl-counter').textContent =
    `Frame ${currentFrame} / ${totalFrames - 1}`;
}

// ── Play / pause ─────────────────────────────────────────────────────────
function startPlay() {
  playing = true;
  document.getElementById('btn-play').textContent = '⏸ Pause';
  document.getElementById('btn-play').classList.add('active-play');
  connectSSE();
}

function stopPlay() {
  playing = false;
  document.getElementById('btn-play').textContent = '▶ Play';
  document.getElementById('btn-play').classList.remove('active-play');
}

document.getElementById('btn-play').addEventListener('click', () => {
  playing ? stopPlay() : startPlay();
});

document.getElementById('btn-prev').addEventListener('click', () => {
  stopPlay();
  fetchFrame((currentFrame - 1 + totalFrames) % (totalFrames || 1));
});

document.getElementById('btn-next').addEventListener('click', () => {
  stopPlay();
  fetchFrame((currentFrame + 1) % (totalFrames || 1));
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  document.getElementById('btn-prev').click();
  if (e.key === 'ArrowRight') document.getElementById('btn-next').click();
  if (e.key === ' ')          document.getElementById('btn-play').click();
});

// ── Boot ──────────────────────────────────────────────────────────────────
// Fetch total snapshot count before connecting SSE
fetch('/api/mock/snapshots')
  .then(r => r.json())
  .then(d => {
    totalFrames = d.total;
    buildTimeline();
    connectSSE();
  });
</script>
</body>
</html>
